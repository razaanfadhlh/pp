function bodySVG(){const P=[["Kepala",'<circle cx="80" cy="34" r="26"/>'],["Tenggorokan",'<rect x="68" y="58" width="24" height="24" rx="8"/>'],["Dada",'<rect x="42" y="84" width="76" height="68" rx="24"/>'],["Perut",'<rect x="46" y="154" width="68" height="62" rx="22"/>'],["Kulit",'<rect x="14" y="88" width="22" height="124" rx="11"/>'],["Kulit",'<rect x="124" y="88" width="22" height="124" rx="11"/>'],["Seluruh tubuh",'<rect x="48" y="220" width="30" height="128" rx="14"/>'],["Seluruh tubuh",'<rect x="82" y="220" width="30" height="128" rx="14"/>']];return `<svg viewBox="0 0 160 360" role="img" aria-label="Peta tubuh">${P.map(([a,e])=>e.replace("/>",` class="reg${S.area==a?" on":""}" data-area="${a}"/>`)).join("")}${S.pins.map(p=>`<circle cx="${p.x}" cy="${p.y}" r="7" fill="#D92D20" stroke="#fff" stroke-width="2" pointer-events="none"/>`).join("")}</svg>`}
function tri(red,r){S.r=r;const hi=r[0]&&r[0].c.urgent&&r[0].p>=50;const l=red?2:(S.sev>=6||hi||S.dur=="Lebih dari 1 minggu")?1:0;S.lvl=l;const T=[["Hijau","Perawatan mandiri di rumah sudah cukup. Pantau 2 sampai 3 hari."],["Kuning","Sebaiknya periksa ke dokter atau puskesmas dalam 1 sampai 2 hari."],["Merah","Segera ke IGD terdekat atau hubungi 119."]][l];return `<div class="tri" style="--c:${C3[l]}"><i class="lamp"></i><div><b>Tingkat urgensi: ${T[0]}</b><br>${T[1]}</div>${l?`<a class="btn mint noprint" href="tel:119" style="text-decoration:none">Telepon 119</a><button class="btn ghost noprint" data-act="faskes">Cari IGD terdekat</button>`:""}</div>`}
function summary(){const all=[...S.sel,...S.ex].map(k=>L[k][0]),dl=[];for(const k of S.sel)(DQ[k]||[]).forEach((x,i)=>{const o=x[1].find(o=>o[1]==S.det[k+i]);if(o&&o[1]!="_")dl.push(L[k][0]+": "+o[0])});return ["HealthVibe: Ringkasan Gejala ("+new Date().toLocaleDateString("id-ID")+")","Gejala: "+all.join(", "),"Lokasi nyeri: "+(S.pins.map(p=>p.a+(p.x<80?" (kanan pasien)":" (kiri pasien)")).join(", ")||"-"),"Durasi: "+S.dur,"Keparahan: "+S.sev+"/10","Usia: "+(S.age||"-"),"Faktor risiko: "+([...S.risk].join(", ")||"-"),"Detail: "+(dl.join("; ")||"-"),"Kemungkinan: "+((S.r||[]).map(x=>x.c.n+" ("+x.p+"%)").join("; ")||"-"),"Tingkat urgensi: "+["Hijau","Kuning","Merah"][S.lvl],"Catatan: analisis awal berbasis gejala, bukan diagnosis dokter."].join("\n")}
function copy(s){s=typeof s=="string"?s:summary();const fb=()=>{const a=document.createElement("textarea");a.value=s;document.body.appendChild(a);a.select();try{document.execCommand("copy");toast("Ringkasan disalin")}catch(e){toast("Gagal menyalin")}a.remove()};try{navigator.clipboard.writeText(s).then(()=>toast("Ringkasan disalin"),fb)}catch(e){fb()}}
function save(b){const t=S.r&&S.r[0],a=rd();a.push({t:Date.now(),sev:S.sev,s:[...S.sel,...S.ex].map(k=>L[k][0]),top:t?t.c.n:"Belum spesifik",l:S.lvl});if(store(a.slice(-60))){b.textContent="Tersimpan di Buku Harian";b.disabled=true}else toast("Penyimpanan tidak tersedia di sini")}
function diary(){const a=rd(),n=a.slice(-14),pts=n.map((e,i)=>[n.length>1?24+i*272/(n.length-1):160,112-(e.sev-1)*10]),tr=n.length>1?n[n.length-1].sev-n[0].sev:0;app.innerHTML=`<section class="step"><h2>Buku harian gejala</h2><p class="cap">Catatan tersimpan hanya di perangkat ini.</p>${a.length?`<div class="q"><h3>Perkembangan tingkat keparahan</h3><svg viewBox="0 0 320 130" style="width:100%;height:auto" role="img" aria-label="Grafik keparahan"><g stroke="var(--line)"><line x1="10" x2="310" y1="22" y2="22"/><line x1="10" x2="310" y1="67" y2="67"/><line x1="10" x2="310" y1="112" y2="112"/></g><polyline fill="none" stroke="var(--blue)" stroke-width="3" stroke-linejoin="round" points="${pts.map(p=>p.join(",")).join(" ")}"/>${pts.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="6" fill="${C3[n[i].l]}"/>`).join("")}</svg><p class="cap" style="margin:6px 0 0">${n.length<2?"Simpan lebih banyak konsultasi untuk melihat tren.":tr<0?"Keparahan menurun, tanda membaik.":tr>0?"Keparahan meningkat. Bila berlanjut, periksa ke dokter.":"Keparahan stabil."}</p></div>${[...a].reverse().slice(0,12).map(e=>`<div class="res" style="padding:16px 20px"><div class="top"><div><b>${e.top}</b><div class="cap" style="margin:2px 0 0">${new Date(e.t).toLocaleString("id-ID",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"})}, keparahan ${e.sev}/10</div><div style="margin-top:6px">${e.s.join(", ")}</div></div><i class="lamp" style="--c:${C3[e.l]}"></i></div></div>`).join("")}<button class="btn ghost" data-act="clear">Hapus semua catatan</button>`:`<div class="res"><h3>Belum ada catatan</h3><p>Selesaikan konsultasi, lalu pilih Simpan ke Buku Harian di halaman hasil.</p><button class="btn mint" data-act="start">Mulai Konsultasi</button></div>`}</section>`}
function tools(){app.innerHTML=`<section class="step"><h2>Kalkulator kesehatan</h2><p class="cap">Isi data Anda. Hasilnya perkiraan umum.</p><div class="q"><div class="chips"><label>Berat (kg)<input class="in" id="bb" type="number" inputmode="decimal" min="2" max="300"></label><label>Tinggi (cm)<input class="in" id="tb" type="number" inputmode="decimal" min="50" max="250"></label><label>Usia (tahun)<input class="in" id="us" type="number" inputmode="numeric" min="1" max="110"></label></div></div><div id="to"></div></section>`;const g=i=>+document.getElementById(i).value,cd=(t,v,d)=>`<div class="res"><h4 style="margin:0">${t}</h4><div class="big">${v}</div><p style="margin:0">${d}</p></div>`;const c=()=>{const b=g("bb"),h=g("tb")/100,u=g("us");let o="";if(b&&h>.5){const v=b/h/h;o+=cd("Indeks massa tubuh",v.toFixed(1),(v<18.5?"Berat kurang":v<23?"Normal":v<25?"Berlebih":v<30?"Obesitas I":"Obesitas II")+". Berat ideal sekitar "+(18.5*h*h).toFixed(0)+" sampai "+(22.9*h*h).toFixed(0)+" kg (acuan Asia-Pasifik).")}if(b)o+=cd("Kebutuhan air harian",(b*.03).toFixed(1)+" sampai "+(b*.035).toFixed(1)+" liter","Tambah saat demam, diare, atau berolahraga.");if(u>0){const m=220-u,z=(x,y)=>Math.round(m*x)+"-"+Math.round(m*y);o+=cd("Denyut jantung maksimal",m+" bpm","Latihan ringan "+z(.5,.6)+", sedang "+z(.6,.7)+", intens "+z(.7,.85)+" bpm.")}document.getElementById("to").innerHTML=o||'<p class="cap">Masukkan berat, tinggi, atau usia.</p>'};document.querySelectorAll(".in").forEach(i=>i.oninput=c);c()}
function go(s){S.step=s;V[s]();window.scrollTo(0,0)}
document.addEventListener("click",e=>{const t=e.target.closest("[data-act],[data-area],[data-sym],[data-dur],[data-ex],[data-q],[data-rk],[data-age],[data-aid],[data-g],[data-tk],[data-sg],[data-mf]");if(!t)return;const d=t.dataset;
if(d.act=="home")go("home");else if(d.act=="diary")go("diary");else if(d.act=="tools")go("tools");else if(d.act=="save")save(t);else if(d.act=="print"){try{print()}catch(x){toast("Gunakan menu cetak browser")}}else if(d.act=="copy")copy();else if(d.act=="faskes"){faskes();scrollTo(0,0)}else if(d.act=="visit"){visit();scrollTo(0,0)}else if(d.act=="vcopy")copy(visitText());else if(d.act=="loc")getLoc();else if(d.act=="aidg"){S.ai=-1;go("aid")}else if(d.act=="mf"){M.q=[];myth();scrollTo(0,0)}else if(d.act=="mnext"){M.i++;M.a=null;myth();scrollTo(0,0)}else if(d.act=="chat"){S.chat=S.chat||[];chat();scrollTo(0,0)}else if(d.act=="unpin"){S.pins=[];select()}else if(d.act=="game"){G.q=[];game();scrollTo(0,0)}else if(d.act=="gnext"){G.i++;G.a=null;game();scrollTo(0,0)}else if(d.act=="back")result();else if(d.act=="clear"){store(null);diary()}else if(d.act=="start")go("select");else if(d.act=="next1")go("ask");else if(d.act=="next2")go("load");
else if(d.act=="reset"){S.sel.clear();S.ex.clear();S.dur="";S.sev=5;S.det={};S.risk.clear();S.age="";S.pins=[];S.chat=[];S.area="Kepala";go("home")}
else if(d.area){S.area=d.area;const sv=t.closest("svg");if(sv){const r=sv.getBoundingClientRect();S.pins.push({a:d.area,x:Math.round((e.clientX-r.left)/r.width*160),y:Math.round((e.clientY-r.top)/r.height*360)});S.pins=S.pins.slice(-5)}select()}
else if(d.sym){S.sel.has(d.sym)?S.sel.delete(d.sym):S.sel.add(d.sym);select()}
else if(d.dur){S.dur=d.dur;const y=scrollY;ask();scrollTo(0,y)}
else if(d.ex){S.ex.has(d.ex)?S.ex.delete(d.ex):S.ex.add(d.ex);t.setAttribute("aria-pressed",S.ex.has(d.ex))}
else if(d.mf!==undefined){if(M.a===null){M.a=+d.mf;if(M.a==M.q[M.i][1]){M.s++;M.k++;M.b=Math.max(M.b,M.k)}else M.k=0;myth()}}else if(d.sg){ask2(d.sg)}else if(d.g!==undefined){if(G.a===null){G.a=+d.g;if(G.a==G.q[G.i][1])G.s++;game()}}else if(d.aid!==undefined){S.ai=+d.aid;go("aid")}else if(d.tk!==undefined){t.setAttribute("aria-pressed",t.getAttribute("aria-pressed")!="true")}else if(d.q){S.det[d.q]=d.t;const y=scrollY;ask();scrollTo(0,y)}
else if(d.age){S.age=d.age;const y=scrollY;ask();scrollTo(0,y)}
else if(d.rk){S.risk.has(d.rk)?S.risk.delete(d.rk):S.risk.add(d.rk);t.setAttribute("aria-pressed",S.risk.has(d.rk))}});
home();
</script>
